<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#061a49"><title>PS3X360 · XMB</title>
<style>
:root{color-scheme:dark;--text:#f5f8ff;--muted:#d2e0f5;--line:#d7eaff55}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071943;color:var(--text);font-family:Tahoma,"Segoe UI",Arial,sans-serif}
body{background:radial-gradient(ellipse at 54% 87%,#327fbd 0,#1d5797 22%,#10366f 47%,#091e50 73%,#061337 100%);isolation:isolate}
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none;background:linear-gradient(110deg,#04112d55,transparent 45%,#0c4c8b22)}
.wave{position:absolute;width:150vw;height:110vh;left:-25vw;top:25vh;border-radius:50%;border-top:1px solid #d9f4ff48;box-shadow:0 -12px 32px #92dfff0b;animation:drift 28s ease-in-out infinite alternate}
.wave.w2{top:38vh;left:-35vw;transform:rotate(-14deg);border-color:#a9e8ff55;animation-duration:35s}
.wave.w3{top:50vh;left:-20vw;transform:rotate(13deg);border-color:#e0f8ff37;animation-duration:31s}
.wave.w4{top:63vh;left:-38vw;transform:rotate(-7deg);border-color:#a0e5ff38;animation-duration:40s}
@keyframes drift{from{translate:-2% -1%;rotate:-3deg}to{translate:2% 1%;rotate:3deg}}
#dust{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}.dot{position:absolute;width:2px;height:2px;border-radius:50%;background:#d9f5ff;opacity:0;box-shadow:0 0 7px #bcecff;animation:float linear infinite}
@keyframes float{0%{transform:translate3d(0,25px,0);opacity:0}15%{opacity:.45}85%{opacity:.2}100%{transform:translate3d(24px,-110vh,0);opacity:0}}
header{position:absolute;top:4%;left:4.2%;right:4.2%;display:flex;justify-content:space-between;align-items:center;text-shadow:0 1px 10px #00102d}
.logo{font-size:clamp(20px,2.1vw,29px);font-weight:200;letter-spacing:.06em;color:#e8f4ff}.logo b{font-weight:600;color:#fff}
.status{display:flex;align-items:center;gap:17px;font-size:clamp(12px,1.1vw,15px);color:#edf6ff}.status .user{font-size:12px;color:#d1e8ff}.status .user:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#9eeaff;margin-right:7px;box-shadow:0 0 8px #9eeaff}
#date{font-size:11px;color:#c4d9ef}
main{position:absolute;inset:0}.categories{position:absolute;top:25.5%;left:5.3%;right:4%;display:flex;align-items:center;gap:clamp(22px,3.55vw,51px);height:65px}
.cat{position:relative;width:clamp(31px,3vw,43px);height:55px;flex:0 0 auto;padding:0;border:0;background:none;color:#e5f2ff;opacity:.83;cursor:pointer;transition:transform .32s ease,opacity .25s ease,color .25s ease}
.cat svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 4px #bdeaff55);overflow:visible}
.cat.selected{transform:scale(1.24);opacity:1;color:#fff;filter:drop-shadow(0 0 9px #d0f2ff88)}
.cat.selected:after{content:"";position:absolute;z-index:-1;left:-20px;right:-20px;top:-16px;bottom:-16px;background:radial-gradient(ellipse,#b9eaff28,transparent 72%)}
.cat:focus-visible,.entry:focus-visible{outline:1px solid white;outline-offset:4px}
.cat-label{display:none}
.cat.selected .cat-label{opacity:1}
.menu{position:absolute;top:36.2%;left:5.1%;width:min(490px,76vw);display:flex;flex-direction:column;align-items:stretch}
.entry{display:flex;align-items:center;gap:13px;min-height:39px;padding:4px 14px;border:1px solid transparent;background:transparent;text-align:left;color:#dceaff;font-size:clamp(13px,1.15vw,16px);font-weight:300;cursor:pointer;text-shadow:0 1px 7px #00102d;transition:background .18s,border-color .18s,transform .18s}
.entry .glyph{width:19px;flex:0 0 19px;text-align:center;font-size:16px;color:#f3faff}
.entry.current{color:#fff;background:linear-gradient(90deg,#eaf8ff40,#d6efff19 70%,transparent);border-color:#e0f5ff24;transform:translateX(3px)}
.entry.current .glyph{filter:drop-shadow(0 0 4px #b5eaff)}
.detail{position:absolute;top:68%;left:6%;width:min(560px,85vw);font-size:12px;line-height:1.7;font-weight:300;color:#d5e7f8;text-shadow:0 1px 8px #00102d}
.detail strong{display:block;color:white;font-size:13px;font-weight:400;margin-bottom:2px}
footer{position:absolute;left:4.3%;right:4.3%;bottom:4%;display:flex;justify-content:space-between;align-items:center;gap:10px;color:#d3e5f7;font-size:10px;text-shadow:0 1px 7px #00102d}
.hints{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.hint{display:flex;align-items:center;gap:5px;white-space:nowrap}.key{display:inline-grid;place-items:center;border:1px solid #edf8ffcc;border-radius:50%;width:16px;height:16px;font-size:9px;color:#fff}
.version{text-align:right;opacity:.82}
.toast{display:none;position:absolute;right:4.3%;bottom:10%;width:min(330px,88vw);padding:12px 15px;background:#071b43d9;border:1px solid #d6f1ff50;backdrop-filter:blur(10px);font-size:12px;line-height:1.6;box-shadow:0 8px 30px #00102d55}
@media(max-width:650px){header{top:3%;left:4%;right:4%}.logo{font-size:20px}.status{gap:8px}.status .user{display:none}#date{font-size:10px}.categories{top:20%;left:3%;right:2%;gap:clamp(16px,4vw,26px);overflow-x:auto;overflow-y:visible;scrollbar-width:none;padding:0 10px}.categories::-webkit-scrollbar{display:none}.cat{width:34px;height:48px}.cat-label{left:50%;top:auto;bottom:-17px;transform:translateX(-50%);font-size:10px}.menu{top:32%;left:4%;width:92%}.entry{min-height:37px;padding:4px 9px;font-size:13px}.detail{top:auto;bottom:13%;left:5%;width:90%;font-size:11px}footer{bottom:2.5%;left:4%;right:4%;font-size:9px;align-items:flex-end}.hints{gap:7px}.version{max-width:25%;line-height:1.4}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head>
<body>
<div class="bg"><i class="wave"></i><i class="wave w2"></i><i class="wave w3"></i><i class="wave w4"></i></div><div id="dust"></div>
<header><div class="logo">PS3<b>X360</b></div><div class="status"><span class="user">Utilizador local</span><span id="date"></span><span id="clock">--:--</span></div></header>
<main><nav class="categories" id="categories" aria-label="Categorias XMB">
<button class="cat selected" data-cat="jogos" aria-label="Jogo" title="Jogo"><svg viewBox="0 0 42 52"><path d="M11 15h20a7 7 0 0 1 7 6l2 13a4.5 4.5 0 0 1-7.2 4L26 33h-10l-6.8 5A4.5 4.5 0 0 1 2 34l2-13a7 7 0 0 1 7-6Z"/><path d="M12 21v10M7 26h10M29 23h.1M34 29h.1"/></svg><span class="cat-label">Jogo</span></button>
<button class="cat" data-cat="homebrew" aria-label="Homebrew" title="Homebrew"><svg viewBox="0 0 42 52"><path d="m3 25 18-17 18 17M8 21v23h26V21M17 44V30h8v14M29 14V8h5v11"/></svg><span class="cat-label">Homebrew</span></button>
<button class="cat" data-cat="musica" aria-label="Música" title="Música"><svg viewBox="0 0 42 52"><path d="M18 35V12l19-4v23"/><ellipse cx="11" cy="37" rx="7" ry="5"/><ellipse cx="30" cy="33" rx="7" ry="5"/></svg><span class="cat-label">Música</span></button>
<button class="cat" data-cat="foto" aria-label="Foto" title="Foto"><svg viewBox="0 0 42 52"><rect x="3" y="12" width="36" height="28" rx="2"/><circle cx="13" cy="21" r="3"/><path d="m5 36 11-10 7 6 6-5 8 9"/></svg><span class="cat-label">Foto</span></button>
<button class="cat" data-cat="video" aria-label="Vídeo" title="Vídeo"><svg viewBox="0 0 42 52"><rect x="3" y="13" width="36" height="27" rx="2"/><path d="m17 19 12 7.5L17 34Z"/></svg><span class="cat-label">Vídeo</span></button>
<button class="cat" data-cat="rede" aria-label="Rede" title="Rede"><svg viewBox="0 0 42 52"><circle cx="21" cy="26" r="17"/><ellipse cx="21" cy="26" rx="7" ry="17"/><path d="M5 21h32M5 31h32"/></svg><span class="cat-label">Rede</span></button>
<button class="cat" data-cat="amigos" aria-label="Amigos" title="Amigos"><svg viewBox="0 0 42 52"><circle cx="15" cy="17" r="6"/><circle cx="29" cy="21" r="4.5"/><path d="M3 40c0-8 5-13 12-13s12 5 12 13M27 30c6 0 11 4 12 10"/></svg><span class="cat-label">Amigos</span></button>
<button class="cat" data-cat="sistema" aria-label="Configurações" title="Configurações"><svg viewBox="0 0 42 52"><path d="m18 7 6 0 2 5 4 2 5-1 3 6-3 4v5l3 4-3 6-5-1-4 3h-6l-2-5-4-2-5 1-3-6 3-4v-5l-3-4 3-6 5 1 2-5Z"/><circle cx="21" cy="26" r="6"/></svg><span class="cat-label">Configurações</span></button>
</nav><section class="menu" id="menu" aria-label="Itens da categoria"></section><div class="detail" id="detail"></div></main>
<div class="toast" id="toast" role="status"></div>
<footer><div class="hints"><span class="hint"><span class="key">←</span><span class="key">→</span> Categoria</span><span class="hint"><span class="key">↑</span><span class="key">↓</span> Selecionar</span><span class="hint"><span class="key">×</span> Confirmar</span><span class="hint"><span class="key">○</span> Voltar</span></div><span class="version">PS3X360 · prévia de interface</span></footer>
<script>
const symbols={folder:"▤",recent:"◷",star:"☆",refresh:"↻",home:"⌂",apps:"▦",plus:"＋",music:"♫",list:"≋",photo:"▧",video:"▶",globe:"◎",user:"♙",settings:"⚙",info:"ⓘ",back:"↩",network:"⌁"};
const content={
 jogos:[["folder","Biblioteca de jogos","Espaço reservado para a biblioteca de jogos do Xbox 360."],["recent","Jogos recentes","Os jogos iniciados recentemente aparecerão aqui quando houver integração nativa."],["star","Favoritos","Acesso rápido aos seus jogos favoritos."],["refresh","Atualizar biblioteca","A leitura real dos dispositivos de armazenamento ainda não está ligada à prévia web."]],
 homebrew:[["home","Aurora","O Aurora é o ponto de retorno previsto; abrir outro aplicativo exige integração nativa."],["apps","Aplicativos homebrew","Lista de aplicativos homebrew, ainda não detectada no console."],["folder","Emuladores","Atalhos de emuladores ainda não configurados."],["plus","Adicionar aplicativo","A descoberta de arquivos XEX ainda não está implementada."]],
 musica:[["music","Reproduzir música","A reprodução de música precisa ser integrada ao sistema nativo."],["list","Listas de reprodução","Suporte a listas locais ainda não implementado."],["folder","Biblioteca de músicas","Os arquivos do console não são acessíveis pela prévia no navegador."]],
 foto:[["photo","Galeria de fotos","A galeria depende de acesso nativo aos arquivos do console."],["folder","Planos de fundo","A personalização do fundo poderá ser adicionada posteriormente."]],
 video:[["video","Biblioteca de vídeos","A reprodução de vídeo ainda não está integrada."],["recent","Vídeos recentes","O histórico ainda não está implementado."]],
 rede:[["globe","Navegador de internet","Atalho visual; esta prévia não inicia um navegador no Xbox."],["network","Conexão de rede","O estado da rede do console ainda não é consultado."],["info","Serviços online","Nenhum serviço online está conectado nesta versão."]],
 amigos:[["user","Lista de amigos","Não acessa Xbox Live nem uma lista real de amigos."],["info","Mensagens","Mensagens ainda não implementadas."]],
 sistema:[["settings","Configurações da interface","As opções de sistema ainda não estão conectadas ao console."],["photo","Tema e aparência","O fundo azul com ondas é animado por CSS."],["info","Sobre PS3X360","Projeto experimental. Esta página é uma prévia web, não um executável XEX."],["back","Voltar ao Aurora","Só poderá funcionar depois da implementação nativa e de testes no Xbox 360 RGH."]]
};
const cats=[...document.querySelectorAll(".cat")],menu=document.getElementById("menu");let cat="jogos",idx=0,lastButtons=[],toastTimer;
function render(){cats.forEach(b=>{const yes=b.dataset.cat===cat;b.classList.toggle("selected",yes);b.setAttribute("aria-pressed",String(yes))});menu.replaceChildren();content[cat].forEach((it,i)=>{const b=document.createElement("button");b.type="button";b.className="entry"+(i===idx?" current":"");const g=document.createElement("span");g.className="glyph";g.textContent=symbols[it[0]]||"•";const t=document.createElement("span");t.textContent=it[1];b.append(g,t);b.addEventListener("click",()=>{idx=i;render()});b.addEventListener("dblclick",activate);menu.append(b)});const d=document.getElementById("detail");d.replaceChildren();const strong=document.createElement("strong");strong.textContent=content[cat][idx][1];d.append(strong,document.createTextNode(content[cat][idx][2]));if(innerWidth<650)cats.find(b=>b.dataset.cat===cat)?.scrollIntoView({block:"nearest",inline:"nearest"})}
function categoryMove(n){let p=cats.findIndex(b=>b.dataset.cat===cat);cat=cats[(p+n+cats.length)%cats.length].dataset.cat;idx=0;render()}
function itemMove(n){idx=(idx+n+content[cat].length)%content[cat].length;render()}
function activate(){const it=content[cat][idx],t=document.getElementById("toast");t.textContent=it[1]+" — "+it[2];t.style.display="block";clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display="none",4300)}
function back(){document.getElementById("toast").style.display="none"}
cats.forEach(b=>b.addEventListener("click",()=>{cat=b.dataset.cat;idx=0;render()}));
document.addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Enter"," ","Escape","Backspace"].includes(e.key))e.preventDefault();if(e.key==="ArrowLeft")categoryMove(-1);else if(e.key==="ArrowRight")categoryMove(1);else if(e.key==="ArrowUp")itemMove(-1);else if(e.key==="ArrowDown")itemMove(1);else if(e.key==="Enter"||e.key===" ")activate();else if(e.key==="Escape"||e.key==="Backspace")back()});
function time(){const d=new Date();document.getElementById("clock").textContent=new Intl.DateTimeFormat("pt-BR",{hour:"2-digit",minute:"2-digit"}).format(d);document.getElementById("date").textContent=new Intl.DateTimeFormat("pt-BR",{weekday:"short",day:"2-digit",month:"short"}).format(d)}time();setInterval(time,15000);
const dust=document.getElementById("dust");for(let i=0;i<38;i++){const d=document.createElement("i");d.className="dot";d.style.left=(Math.random()*100)+"%";d.style.top=(Math.random()*100)+"%";d.style.animationDuration=(13+Math.random()*23)+"s";d.style.animationDelay=(-Math.random()*30)+"s";d.style.opacity=".25";dust.append(d)}render();
function padLoop(){const p=Array.from(navigator.getGamepads?.()||[]).find(Boolean);if(p){const now=p.buttons.map(b=>b.pressed),edge=i=>now[i]&&!lastButtons[i];if(edge(14))categoryMove(-1);if(edge(15))categoryMove(1);if(edge(12))itemMove(-1);if(edge(13))itemMove(1);if(edge(0))activate();if(edge(1))back();lastButtons=now}requestAnimationFrame(padLoop)}if(navigator.getGamepads)requestAnimationFrame(padLoop);
</script></body></html>
